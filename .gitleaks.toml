title = "point_of_sale gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic enrollment key used only to assert the MFA request shape"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^frontend/src/internal-ops/api\.test\.ts$''']
regexes = ['''private-enrollment-key-with-32-characters''']

[[allowlists]]
description = "Synthetic Stripe key used only to assert Ops response redaction"
targetRules = ["stripe-access-token"]
condition = "AND"
regexTarget = "line"
paths = ['''^backend/app/tests/test_ops_tenants_revenue_funnel\.py$''']
regexes = ['''sk_test_supersecretkey123''']

[[allowlists]]
description = "Synthetic Stripe sentinel used only to assert global Ops response redaction"
targetRules = ["stripe-access-token"]
condition = "AND"
regexTarget = "line"
paths = ['''^backend/app/tests/test_ops_no_secrets\.py$''']
regexes = ['''sk_test_SENTINELstripekey''']
