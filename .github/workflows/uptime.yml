name: uptime

# Lightweight health probe for the production backend until UptimeRobot is
# provisioned (Sprint 5 Pre-Beta Ops checklist). Runs every 10 minutes,
# fails the workflow if /health does not return 200, and notifies via the
# standard GitHub Actions failure email to the repo admins.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check backend /health
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/body -w "%{http_code}" \
              --max-time 10 \
              https://pos-project-backend.fly.dev/health || true)
            if [ "$status" = "200" ]; then
              echo "OK on attempt $attempt"
              cat /tmp/body
              exit 0
            fi
            echo "Attempt $attempt failed (status=$status)"
            sleep 10
          done
          echo "Backend /health did not return 200 after 3 attempts" >&2
          exit 1
