name: Prepare Café Cortés demo

on:
  push:
    branches: [feature/cafe-cortes-demo]
    paths:
      - backend/scripts/cafe_cortes_plan.py
      - backend/scripts/seed_cafe_cortes.py
      - docs/demos/cafe-cortes/manifest.json
      - .github/workflows/cafe-cortes-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe-cortes-demo
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/feature/cafe-cortes-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies
        working-directory: backend
        run: pip install uv==0.9.18 && uv sync --frozen
      - name: Validate immutable scenario before writes
        working-directory: backend
        env:
          APP_ENV: local
        run: uv run python scripts/seed_cafe_cortes.py --manifest ../docs/demos/cafe-cortes/manifest.json --output reports/cafe-cortes-evidence.json
      - name: Provision demo and verify deployed APIs
        working-directory: backend
        env:
          APP_ENV: local
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run python scripts/seed_cafe_cortes.py --apply --manifest ../docs/demos/cafe-cortes/manifest.json --output reports/cafe-cortes-evidence.json
      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cafe-cortes-evidence
          path: backend/reports/cafe-cortes-evidence.json
          if-no-files-found: warn
          retention-days: 7
