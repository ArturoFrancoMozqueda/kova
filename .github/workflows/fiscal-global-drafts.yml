name: Prepare due fiscal global drafts

on:
  schedule:
    # Run four times daily. The backend calculates closed periods in
    # America/Mexico_City and catches up missed runs idempotently, so the
    # workflow does not depend on a fragile exact-midnight execution and the
    # worst-case preparation delay stays below six hours.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: fiscal-global-drafts
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare due operational drafts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate scheduler configuration
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${INTERNAL_API_KEY:-}" ]; then
            echo "::error::INTERNAL_API_KEY secret is empty."
            exit 1
          fi

      - name: Prepare due operational drafts
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/fiscal-global-drafts-response.json"
          http_code="$(curl --silent --show-error \
            --retry 3 --retry-all-errors \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Internal-Key: $INTERNAL_API_KEY" \
            --data '{"tenant_limit":100,"periods_per_tenant":31}' \
            https://pos-project-backend.fly.dev/api/v1/fiscal/internal/global-drafts/auto-close)"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Fiscal draft scheduler returned HTTP $http_code."
            exit 1
          fi
          python - "$response_file" <<'PY'
          import json
          import pathlib
          import sys

          response = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "tenants_examined",
              "batches_created",
              "batches_replayed",
              "periods_skipped_empty",
              "failures",
          }
          if set(response) != required or any(
              not isinstance(response[key], int) or response[key] < 0 for key in required
          ):
              raise SystemExit("::error::Fiscal draft scheduler returned an invalid response.")
          print(
              "Fiscal drafts: "
              f"tenants={response['tenants_examined']} "
              f"created={response['batches_created']} "
              f"replayed={response['batches_replayed']} "
              f"empty={response['periods_skipped_empty']} "
              f"failures={response['failures']}"
          )
          if response["failures"]:
              raise SystemExit("::error::One or more tenants failed fiscal draft preparation.")
          PY

      - name: Failure notice
        if: failure()
        run: |
          echo "::error::Fiscal draft preparation failed. Verify INTERNAL_API_KEY, backend health, and fiscal job logs."
