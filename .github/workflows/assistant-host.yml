name: Prepare isolated assistant file host

on:
  workflow_dispatch:

permissions:
  contents: read

# Shares serialization with normal production releases; no scheduled task.
concurrency:
  group: CI and release-refs/heads/main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - name: Require the accepted application release
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen("https://api.kovasuite.com/health", timeout=20) as response:
              body = json.load(response)
          if body.get("status") != "ok" or body.get("release_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("Complete the normal validated production release first")
          PY
      - name: Provision one approved host and verify its real parser
        run: python3 scripts/assistant_host_release.py provision --sha "$GITHUB_SHA" --monthly-limit-usd 35
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
