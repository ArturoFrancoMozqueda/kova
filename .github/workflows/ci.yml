name: CI and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A main release may not overtake another release: Fly is updated before the
# Vercel candidate is accepted, so overlapping SHAs could otherwise race.
# Obsolete PR validation is safe to cancel because it never deploys.
concurrency:
  group: >-
    ${{ github.event_name == 'push'
        && format('{0}-{1}', github.workflow, github.ref)
        || format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.policy.outputs.code }}
      parser: ${{ steps.policy.outputs.parser }}
      supply: ${{ steps.policy.outputs.supply }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: policy
        run: python3 scripts/ci_policy.py changes
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}

  repository:
    name: repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/check_ops_readiness.py repository
      - run: python -m unittest discover -s scripts/tests

  backend-integration:
    name: integration (FastAPI + Postgres)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      APP_ENV: ci
      SECRET_KEY: ci-only-not-a-real-secret-key-do-not-use-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.18"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Run integration suite
        run: uv run pytest --durations=40 --junitxml=reports/backend.xml
      - name: Check versioned OpenAPI contract
        run: uv run python scripts/export_openapi.py --check
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-json
          path: specs/openapi.json
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.run_attempt }}
          path: |
            backend/reports/backend.xml
          retention-days: 7

  frontend:
    name: frontend tests, build and browser preview
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:api-contract
      - run: npm test -- --run --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - run: npm run test:release-contract
      - run: npm run build
      - run: npm run check:bundle-secrets
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the existing production build
        run: npm run test:e2e-preview:built -- --reporter=list,junit,html
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/preview.xml
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.run_attempt }}
          path: |
            frontend/reports
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  integration:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start disposable application stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait
      - name: Run integration and real-browser axe gates
        run: npm run test:integration -- --reporter=list,junit,html
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/integration.xml
          KOVA_INTEGRATION: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
      - name: Collect disposable stack logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - name: Tear down disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-${{ github.run_attempt }}
          path: |
            frontend/reports/integration.xml
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  migrations:
    name: migration reversibility
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 6
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      APP_ENV: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.18"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - name: Test populated upgrades, branch attribution and runtime grants
        run: uv run python -m pytest -q migration_tests --durations=20 --junitxml=reports/migrations.xml
      - name: Upload migrations diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migrations-${{ github.run_attempt }}
          path: |
            backend/reports/migrations.xml
          retention-days: 7

  security:
    name: secrets and dependency audit
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.18"
      - name: Audit Python runtime dependencies
        run: uv sync --frozen --no-dev && uv run --with pip-audit pip-audit
        working-directory: backend
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Audit npm runtime dependencies
        run: npm audit --omit=dev --audit-level=high --package-lock-only
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assistant-parser:
    name: isolated assistant parser and antivirus
    needs: [changes]
    if: needs.changes.outputs.parser == 'true'
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build parser with current antivirus signatures
        run: docker build --tag kova-assistant-parser:1 backend/assistant-parser
      - name: Verify isolated business files and adversarial rejection
        run: python3 backend/scripts/check_assistant_parser.py

  supply-chain:
    needs: [changes]
    if: needs.changes.outputs.supply == 'true'
    uses: ./.github/workflows/ci-maintenance.yml


  required:
    name: CI required
    if: always()
    needs: [changes, repository, backend-integration, frontend, integration, migrations, security, assistant-parser, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require every applicable validation
        run: python3 scripts/ci_policy.py gate
        env:
          CI_POLICY: ${{ toJSON(needs.changes.outputs) }}
          CI_NEEDS: ${{ toJSON(needs) }}


  release:
    name: publish and verify release
    needs: [changes, required]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - run: npm ci
        working-directory: frontend
      - name: Capture and verify current production before creating a candidate
        shell: bash
        run: |
          set -euo pipefail
          fly_image="$(cd backend && flyctl status --json | jq -er '.Machines[0].config.image // .machines[0].config.image')"
          previous_sha="$(curl --fail --silent --show-error https://api.kovasuite.com/health | jq -er '.release_sha')"
          [[ "$previous_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Current backend did not expose a complete release SHA." >&2
            exit 1
          }
          vercel_auto_assign="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --get --data-urlencode "teamId=$VERCEL_ORG_ID" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" |
              jq -r '.autoAssignCustomDomains'
          )"
          [[ "$vercel_auto_assign" == "false" ]] || {
            echo "Vercel autoAssignCustomDomains must remain disabled for CI-controlled promotion." >&2
            exit 1
          }
          production_host="$(node -e 'console.log(new URL(process.env.VERCEL_PRODUCTION_URL).hostname)')"
          vercel_deployment="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --get --data-urlencode "teamId=$VERCEL_ORG_ID" \
              "https://api.vercel.com/v13/deployments/$production_host" |
              jq -er '.url'
          )"
          [[ "$vercel_deployment" == https://* ]] || vercel_deployment="https://$vercel_deployment"

          node frontend/scripts/verify-deployment.mjs \
            --frontend "$VERCEL_PRODUCTION_URL" \
            --backend "https://api.kovasuite.com" \
            --sha "$previous_sha"

          jq -n \
            --arg releaseSha "$previous_sha" \
            --arg flyImage "$fly_image" \
            --arg vercelDeployment "$vercel_deployment" \
            --arg frontendUrl "$VERCEL_PRODUCTION_URL" \
            --arg backendUrl "https://api.kovasuite.com" \
            '{releaseSha:$releaseSha,flyImage:$flyImage,vercelDeployment:$vercelDeployment,frontendUrl:$frontendUrl,backendUrl:$backendUrl}' \
            > "$RUNNER_TEMP/release-rollback.json"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Persist exact rollback artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rollback-${{ github.sha }}
          path: ${{ runner.temp }}/release-rollback.json
          if-no-files-found: error
          retention-days: 7
      - name: Release candidate, promote and recover by phase
        run: node frontend/scripts/release.mjs --artifact "$RUNNER_TEMP/release-rollback.json"
        env:
          COMMIT_SHA: ${{ github.sha }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
