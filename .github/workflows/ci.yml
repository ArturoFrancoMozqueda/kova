name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

# Main releases, including explicit reruns after configuration changes, may
# not overtake one another while backend and frontend candidates are verified.
# Obsolete PR validation is safe to cancel because it never deploys.
concurrency:
  group: >-
    ${{ github.event_name != 'pull_request'
        && format('{0}-{1}', github.workflow, github.ref)
        || format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Reading pull request runs lets a main push reuse an identical tree.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      code: ${{ steps.policy.outputs.code }}
      backend: ${{ steps.policy.outputs.backend }}
      frontend: ${{ steps.policy.outputs.frontend }}
      parser: ${{ steps.policy.outputs.parser }}
      supply: ${{ steps.policy.outputs.supply }}
      reused: ${{ steps.policy.outputs.reused }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: policy
        run: python3 scripts/ci_policy.py changes
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}

  repository:
    name: repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/check_ops_readiness.py repository
      - run: python -m unittest discover -s scripts/tests

  backend-integration:
    name: integration (FastAPI + Postgres)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      APP_ENV: ci
      SECRET_KEY: ci-only-not-a-real-secret-key-do-not-use-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Run integration suite
        run: uv run pytest -n 4 --dist loadgroup --durations=40 --junitxml=reports/backend.xml
      - name: Check versioned OpenAPI contract
        run: uv run python scripts/export_openapi.py --check
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-json
          path: specs/openapi.json
          retention-days: 7
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.run_attempt }}
          path: |
            backend/reports/backend.xml
          retention-days: 7

  backend-workers:
    name: integration (Cloudflare Free + Postgres)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+pg8000://pos:pos@127.0.0.1:5432/pos
      KOVA_WORKERS_TEST_DATABASE_URL: postgresql://pos:pos@127.0.0.1:5432/pos
      APP_ENV: ci
      SECRET_KEY: ci-only-not-a-real-secret-key-do-not-use-in-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
      - run: uv sync --project backend --frozen
      - run: uv pip install --python backend/.venv/bin/python pg8000==1.31.5
      - name: Verify full backend suite with the Workers Postgres driver
        working-directory: backend
        run: uv run --no-sync pytest -n 4 --dist loadgroup -q --junitxml=reports/workers-driver.xml
      - name: Provision disposable runtime role
        run: psql -h 127.0.0.1 -U pos -d pos -v kova_app_password=kova_app -f backend/scripts/provision_app_role.sql
        env:
          PGPASSWORD: pos
      - name: Install locked WebAssembly dependencies
        run: |
          uv python install cpython-3.14.2-emscripten-wasm32-musl
          uv venv /tmp/kova-pyodide --python cpython-3.14.2-emscripten-wasm32-musl
          uv pip install --python /tmp/kova-pyodide/bin/python --only-binary :all: --preview-features pylock -r deploy/cloudflare-backend/pylock.toml
      - run: npm ci
        working-directory: deploy/cloudflare-backend
      - name: Build Workers without deployment credentials
        run: npm run build
        working-directory: deploy/cloudflare-backend
        env:
          KOVA_WORKERS_PACKAGES: /tmp/kova-pyodide/lib/python3.14/site-packages
      - name: Generate synthetic cross-runtime crypto fixtures
        run: backend/.venv/bin/python deploy/cloudflare-backend/test/generate_fixtures.py deploy/cloudflare-backend/.cloudflare/test-fixtures.json
        env:
          PYTHONPATH: backend
      - name: Verify API, crypto, telemetry and isolated jobs in workerd
        run: npm test
        working-directory: deploy/cloudflare-backend

  frontend-unit:
    name: frontend unit and contracts
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:api-contract
      - run: npm test -- --run --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - run: npm run test:release-contract
      - run: npm ci --prefix deploy/cloudflare && npm test --prefix deploy/cloudflare
        working-directory: .
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-unit-${{ github.run_attempt }}
          path: frontend/reports/vitest.xml
          retention-days: 7

  frontend:
    name: frontend production build and browser (${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Each shard owns its runner and preview server; more workers on one
    # runner were slower because they shared its CPU with the server.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle-secrets
      - name: Install and verify Chromium
        # Hosted runners normally have these libraries. Avoid a network-bound
        # apt update unless a real browser launch proves dependencies missing.
        run: |
          npx playwright install --only-shell chromium
          if ! node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close();'; then
            npx playwright install-deps chromium
          fi
      - name: Test the existing production build
        run: npm run test:e2e-preview:built -- --shard=${{ matrix.shard }}/2 --reporter=list,junit,html
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/preview.xml
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            frontend/reports
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  integration:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reused != 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install and verify Chromium
        # Hosted runners normally have these libraries. Avoid a network-bound
        # apt update unless a real browser launch proves dependencies missing.
        run: |
          npx playwright install --only-shell chromium
          if ! node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); await browser.close();'; then
            npx playwright install-deps chromium
          fi
        working-directory: frontend
      - name: Start disposable application stack
        run: docker compose -f docker-compose.test.yml up -d --build --wait
      - name: Run integration and real-browser axe gates
        run: npm run test:integration -- --reporter=list,junit,html
        working-directory: frontend
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/integration.xml
          KOVA_INTEGRATION: "1"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5174
      - name: Collect disposable stack logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color
      - name: Tear down disposable stack
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-${{ github.run_attempt }}
          path: |
            frontend/reports/integration.xml
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  migrations:
    name: migration reversibility
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 6
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pos:pos@localhost:5432/pos
      APP_ENV: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - name: Test populated upgrades, branch attribution and runtime grants
        run: uv run python -m pytest -q migration_tests --durations=20 --junitxml=reports/migrations.xml
      - name: Upload migrations diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migrations-${{ github.run_attempt }}
          path: |
            backend/reports/migrations.xml
          retention-days: 7

  security:
    name: secrets and dependency audit
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.13.4"
      - name: Audit Python runtime dependencies
        run: uv sync --frozen --no-dev && uv run --with pip-audit pip-audit
        working-directory: backend
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Audit npm runtime dependencies
        run: npm audit --omit=dev --audit-level=high --package-lock-only
        working-directory: frontend
      - name: Reject critical vulnerabilities in build and test dependencies
        run: npm audit --audit-level=critical --package-lock-only
        working-directory: frontend
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assistant-parser:
    name: isolated assistant parser and antivirus
    needs: [changes]
    if: needs.changes.outputs.parser == 'true'
    timeout-minutes: 8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build parser with current antivirus signatures
        run: docker build --tag kova-assistant-parser:1 backend/assistant-parser
      - name: Verify isolated business files and adversarial rejection
        run: python3 backend/scripts/check_assistant_parser.py

  supply-chain:
    needs: [changes]
    if: needs.changes.outputs.supply == 'true'
    uses: ./.github/workflows/ci-maintenance.yml


  backend-native:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/native-backend.yml

  required:
    name: CI required
    if: always()
    needs: [changes, repository, backend-integration, backend-workers, backend-native, frontend-unit, frontend, integration, migrations, security, assistant-parser, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require every applicable validation
        run: python3 scripts/ci_policy.py gate
        env:
          CI_POLICY: ${{ toJSON(needs.changes.outputs) }}
          CI_NEEDS: ${{ toJSON(needs) }}
      # The tree this run proved; a main push of the same tree reuses it.
      - name: Record the verified tree
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tree.txt"
      - name: Upload the verified tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-verified-tree
          path: ${{ runner.temp }}/tree.txt
          if-no-files-found: error
          retention-days: 7


  release:
    name: publish and verify release
    needs: [changes, required]
    # Planned optional skips must not suppress a successful aggregate gate.
    # Failed/cancelled/missing gates still block all production effects.
    if: always() && !cancelled() && needs.required.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
    # Include provider tooling/build time, a native rollout and its recovery.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Capture and verify current production before creating a candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$KOVA_CLOUDFLARE_BACKEND" = "1"
          previous_sha="$(curl --fail --silent --show-error https://api.kovasuite.com/health | jq -er '.release_sha')"
          [[ "$previous_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Current backend did not expose a complete release SHA." >&2
            exit 1
          }
          vercel_auto_assign="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --get --data-urlencode "teamId=$VERCEL_ORG_ID" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" |
              jq -r '.autoAssignCustomDomains'
          )"
          [[ "$vercel_auto_assign" == "false" ]] || {
            echo "Vercel autoAssignCustomDomains must remain disabled for CI-controlled promotion." >&2
            exit 1
          }
          production_host="$(node -e 'console.log(new URL(process.env.VERCEL_PRODUCTION_URL).hostname)')"
          vercel_deployment="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              --get --data-urlencode "teamId=$VERCEL_ORG_ID" \
              "https://api.vercel.com/v13/deployments/$production_host" |
              jq -er '.url'
          )"
          [[ "$vercel_deployment" == https://* ]] || vercel_deployment="https://$vercel_deployment"

          node frontend/scripts/verify-deployment.mjs \
            --frontend "$VERCEL_PRODUCTION_URL" \
            --backend "https://api.kovasuite.com" \
            --sha "$previous_sha"

          jq -n \
            --arg releaseSha "$previous_sha" \
            --arg vercelDeployment "$vercel_deployment" \
            --arg frontendUrl "$VERCEL_PRODUCTION_URL" \
            --arg backendUrl "https://api.kovasuite.com" \
            '{releaseSha:$releaseSha,vercelDeployment:$vercelDeployment,frontendUrl:$frontendUrl,backendUrl:$backendUrl}' \
            > "$RUNNER_TEMP/release-rollback.json"
        env:
          KOVA_CLOUDFLARE_BACKEND: ${{ vars.KOVA_CLOUDFLARE_BACKEND }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Install Cloudflare deployment tools
        if: vars.KOVA_CLOUDFLARE_FRONTEND == '1'
        run: npm ci --prefix deploy/cloudflare
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: vars.KOVA_CLOUDFLARE_BACKEND == '1'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: vars.KOVA_CLOUDFLARE_BACKEND == '1'
        with:
          version: "0.13.4"
      - name: Prepare locked Cloudflare backend deployment tools
        if: vars.KOVA_CLOUDFLARE_BACKEND == '1'
        run: |
          set -euo pipefail
          npm ci --prefix deploy/cloudflare-backend
          if [[ "$KOVA_NATIVE_BACKEND" == "1" ]]; then npm ci --prefix deploy/cloudflare-native; fi
          uv sync --project backend --frozen
          uv python install cpython-3.14.2-emscripten-wasm32-musl
          uv venv /tmp/kova-release-pyodide --python cpython-3.14.2-emscripten-wasm32-musl
          uv pip install --python /tmp/kova-release-pyodide/bin/python --only-binary :all: --preview-features pylock -r deploy/cloudflare-backend/pylock.toml
        env:
          KOVA_NATIVE_BACKEND: ${{ vars.KOVA_NATIVE_BACKEND }}
      - name: Capture exact Cloudflare rollback version
        if: vars.KOVA_CLOUDFLARE_FRONTEND == '1' || vars.KOVA_CLOUDFLARE_BACKEND == '1'
        run: node frontend/scripts/capture-cloudflare.mjs "$RUNNER_TEMP/release-rollback.json"
        env:
          KOVA_NATIVE_BACKEND: ${{ vars.KOVA_NATIVE_BACKEND }}
          KOVA_CLOUDFLARE_FRONTEND: ${{ vars.KOVA_CLOUDFLARE_FRONTEND }}
          KOVA_CLOUDFLARE_BACKEND: ${{ vars.KOVA_CLOUDFLARE_BACKEND }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Persist exact rollback artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-rollback-${{ github.sha }}
          path: ${{ runner.temp }}/release-rollback.json
          if-no-files-found: error
          retention-days: 7
      - name: Release candidate, promote and recover by phase
        run: node frontend/scripts/release.mjs --artifact "$RUNNER_TEMP/release-rollback.json"
        env:
          COMMIT_SHA: ${{ github.sha }}
          KOVA_CLOUDFLARE_FRONTEND: ${{ vars.KOVA_CLOUDFLARE_FRONTEND }}
          KOVA_CLOUDFLARE_BACKEND: ${{ vars.KOVA_CLOUDFLARE_BACKEND }}
          KOVA_HYPERDRIVE_APP_ID: ${{ vars.KOVA_HYPERDRIVE_APP_ID }}
          KOVA_HYPERDRIVE_PRIVILEGED_ID: ${{ vars.KOVA_HYPERDRIVE_PRIVILEGED_ID }}
          KOVA_NATIVE_BACKEND: ${{ vars.KOVA_NATIVE_BACKEND }}
          KOVA_WORKERS_PACKAGES: /tmp/kova-release-pyodide/lib/python3.14/site-packages
          SUPABASE_DB_URL: ${{ vars.KOVA_CLOUDFLARE_BACKEND == '1' && secrets.SUPABASE_DB_URL || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
