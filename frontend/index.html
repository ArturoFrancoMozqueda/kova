    <style>
      /* Pre-React paint: keep the page from flashing white before the JS
         bundle hydrates. Removed automatically once <div id="root"> renders. */
      html, body { margin: 0; background: #F5F6FA; }
      #root:empty::before {
        content: "";
        position: fixed; inset: 0;
        background:
          radial-gradient(120px 120px at 50% 38%, #E2E6EF 0%, #F5F6FA 70%) no-repeat,
          #F5F6FA;
        /* Values hardcoded on purpose. This is the ONE place a duplicate of
           `pulse-soft` is correct: the rule paints before the CSS bundle (and
           therefore --kova-dur-* and the Tailwind keyframes) has arrived, so
           referencing them would leave the splash frozen in the only moment it
           exists for. Timing matches pulse-soft — 1.5s, floor 0.6 — so the
           handoff from splash to the first skeletons keeps one rhythm. */
        animation: kovaPulse 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes kovaPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before { animation: none; }
      }
    </style>
