    <style>
      /* Pre-React paint: keep the page from flashing white before the JS
         bundle hydrates. Removed automatically once <div id="root"> renders. */
      html, body { margin: 0; background: #F5F6FA; }
      #root:empty::before {
        content: "";
        position: fixed; inset: 0;
        background:
          radial-gradient(120px 120px at 50% 38%, #E2E6EF 0%, #F5F6FA 70%) no-repeat,
          #F5F6FA;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vercel Web Analytics: an independent second source for landing traffic.
         Our own funnel table is the primary instrument, but it is the thing that
         was contaminated (docs/audits/DIAGNOSTICO-CRECIMIENTO-2026-08-09.md), and
         a single instrument you cannot cross-check is how bad numbers survive.
         Same-origin, so the existing `script-src 'self'` CSP already allows it.
         REQUIRES Web Analytics to be switched on for the project in the Vercel
         dashboard — until then this path 404s and nothing is collected. -->
    <script defer src="/_vercel/insights/script.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
