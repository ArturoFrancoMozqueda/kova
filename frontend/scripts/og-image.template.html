<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<title>Kova · OG image 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0A0C12;
    --blue: #4F7EF7;
    --growth: #1EBF8A;
    --fg: #F5F8FF;
    --muted: #8B97AE;
    --hairline: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .canvas {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(720px 520px at 14% 10%, rgba(79,126,247,0.22), transparent 58%),
      radial-gradient(620px 620px at 98% 108%, rgba(30,191,138,0.10), transparent 58%),
      linear-gradient(180deg, #12141D 0%, #0A0C12 100%);
    padding: 60px 64px;
    display: grid;
    grid-template-columns: 1.02fr 0.98fr;
    gap: 44px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* Giant faint wordmark behind the laptop (matches the landing showcase). */
  .ghost {
    position: absolute;
    right: -4%;
    top: 50%;
    transform: translateY(-50%);
    font-size: 300px;
    font-weight: 700;
    letter-spacing: -0.05em;
    color: rgba(240, 244, 255, 0.035);
    line-height: 1;
    user-select: none;
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Left: brand + headline ---------- */
  .left {
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 40px;
  }
  .logo-mark { width: 34px; height: 34px; }
  .wordmark {
    font-weight: 600;
    font-size: 25px;
    letter-spacing: -0.02em;
    color: var(--fg);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .eyebrow::before {
    content: "";
    width: 26px; height: 2px;
    background: var(--blue);
    border-radius: 2px;
    flex-shrink: 0;
  }

  h1 {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.035em;
    color: var(--fg);
    max-width: 560px;
  }

  .subhead {
    margin-top: 22px;
    font-size: 18px;
    line-height: 1.5;
    color: var(--muted);
    font-weight: 400;
    max-width: 520px;
  }
  .subhead strong { color: #C9D2E4; font-weight: 600; }

  .footer-row {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .url {
    font-size: 18px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.01em;
  }
  .url-sub {
    font-size: 13px;
    color: #7C879E;
    font-weight: 500;
  }

  /* ---------- Right: laptop with the real Panel screenshot ---------- */
  .right {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .laptop {
    width: 100%;
    max-width: 545px;
    display: flex;
    flex-direction: column;
    align-items: center;
    filter: drop-shadow(0 42px 70px rgba(0,0,0,0.55));
  }
  .lid {
    width: 100%;
    background: linear-gradient(180deg, #2A2E3A, #191C25);
    border-radius: 16px;
    padding: 11px;
    border: 1px solid var(--hairline);
    position: relative;
  }
  .lid::before {
    /* camera / notch dot in the top bezel */
    content: "";
    position: absolute;
    top: 4px; left: 50%;
    transform: translateX(-50%);
    width: 70px; height: 5px;
    background: #14171F;
    border-radius: 0 0 8px 8px;
  }
  .screen {
    width: 100%;
    border-radius: 9px;
    overflow: hidden;
    background: #0B0D13;
    border: 1px solid rgba(255,255,255,0.05);
    aspect-ratio: 16 / 10;
  }
  .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .base {
    width: 113%;
    height: 14px;
    border-radius: 0 0 13px 13px;
    background: linear-gradient(180deg, #3A3F4B, #20242F);
    border: 1px solid var(--hairline);
    border-top: none;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.45);
  }
  .base::after {
    content: "";
    display: block;
    width: 15%;
    height: 5px;
    margin: 0 auto;
    border-radius: 0 0 6px 6px;
    background: rgba(255,255,255,0.10);
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="ghost">kova</div>

  <!-- LEFT -->
  <div class="left">
    <div class="brand">
      <svg class="logo-mark" viewBox="0 0 64 64" fill="none">
        <path d="M 32 8 A 52 52 0 0 1 52.78 44" stroke="#F5F8FF" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M 52.78 44 A 52 52 0 0 1 11.22 44" stroke="#F5F8FF" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M 11.22 44 A 52 52 0 0 1 32 8" stroke="#F5F8FF" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="32" cy="8" r="6" fill="#F5F8FF"/>
        <circle cx="52.78" cy="44" r="6" fill="#F5F8FF"/>
        <circle cx="11.22" cy="44" r="6" fill="#F5F8FF"/>
        <circle cx="32" cy="32" r="6" fill="#4F7EF7"/>
      </svg>
      <span class="wordmark">kova</span>
    </div>

    <div>
      <div class="eyebrow">Son las 9 de la noche. Bajas la cortina.</div>
      <h1>Deja de adivinar qué pasa en tu negocio.</h1>
      <p class="subhead">
        ¿Vendiste bien hoy… o solo lo sientes? Kova te ayuda a saberlo sin hacer
        cuentas al final del día — <strong>caja, inventario, empleados y reportes</strong>
        en una sola app.
      </p>
    </div>

    <div class="footer-row">
      <span class="url">kovasuite.com</span>
      <span class="url-sub">7 días gratis · sin tarjeta</span>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="laptop">
      <div class="lid">
        <div class="screen">
          <img src="../public/showcase/panel.png" alt="Panel de Kova"/>
        </div>
      </div>
      <div class="base"></div>
    </div>
  </div>

</div>
</body>
</html>
