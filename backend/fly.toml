# fly.toml app configuration file generated for pos-project-backend on 2026-05-09T11:21:39-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pos-project-backend'
primary_region = 'dfw'

[build]

[deploy]
  release_command = "uv run alembic upgrade head"

[processes]
  app = "/usr/local/bin/uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
  assistant = "/usr/local/bin/uv run python scripts/run_assistant_worker.py --workload chat"
  ingest = "/usr/local/bin/uv run python scripts/run_assistant_ingest.py --workload ingest"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  processes = ['app']
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# Dedicated chat/retention worker, without public HTTP service or parser daemon.
# Knowledge-file ingestion stays disabled until its isolated host is provisioned.
[[vm]]
  processes = ['assistant']
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

# Provision exactly one instance in iad, after the approved quote and file QA.
# Release commands deploy app/chat first; they do not create this paid host.
[[vm]]
  processes = ['ingest']
  memory = '5gb'
  cpus = 4
  memory_mb = 5120
