[project]
name = "pos-backend"
version = "0.0.1"
description = "POS SaaS backend (Sprint 0A skeleton)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "PyJWT>=2.10",
    "email-validator>=2.2",
    "sentry-sdk[fastapi]>=2.19",
    "resend>=2.0",
    "Pillow>=11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".venv-win"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = ["B008"]  # FastAPI Depends() in function defaults is intentional

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]
"app/tests/**" = ["E501"]
"scripts/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
markers = [
    "p0: P0 product-critical scenario",
    "auth: auth and session scenario",
    "bdd: pytest-bdd scenario",
    "catalog: catalog scenario",
    "permission: permission boundary scenario",
    "tenant-isolation: tenant isolation scenario",
    "audit: audit log scenario",
    "idempotency: idempotency scenario",
    "money: decimal money scenario",
    "orders: order creation scenario",
    "payment: payment recording scenario",
    "inventory: inventory movement scenario",
    "offline: offline sync scenario",
    "dead-letter: dead-letter recovery scenario",
    "modifiers: product modifier scenario",
]
